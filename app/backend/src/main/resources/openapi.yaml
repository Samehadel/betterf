openapi: 3.1.0
info:
  title: theeverthread API
  version: 0.1.1
  description:
    One global account with many-to-many workspace memberships. Email/password activation creates one
    default owned workspace. Invitation acceptance adds membership alongside the default. All protected workspace
    resources require explicit X-Workspace-Id; mutations require CSRF. Sessions and refresh cookies retain their
    established lifetimes.
paths:
  /api/auth/social/providers:
    get:
      operationId: socialProviders
      security: []
      responses:
        "200":
          description:
            Envelope data contains provider IDs linkedin/facebook and availability booleans. No credentials
            are returned.
      summary: List configured providers for existing accounts.
  /api/auth/oauth/authorize/{provider}:
    get:
      operationId: startSocialAuthentication
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum:
              - linkedin
              - facebook
      responses:
        "302":
          description: Redirect to configured provider with session-bound OAuth state and OIDC nonce where applicable.
      summary: Start trusted provider login or linking.
  /api/auth/oauth/callback/{provider}:
    get:
      operationId: completeSocialAuthentication
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum:
              - linkedin
              - facebook
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        "302":
          description:
            Validated authentication redirects to knowledge or explicit linking. Failures redirect to
            login with a safe error code. New social account creation returns SIGNUP_REQUIRED; only existing identities
            can log in or link. No raw provider principal grants product access.
      summary: Complete provider login or linking; new social signup is disabled.
  /api/auth/social/pending:
    get:
      operationId: pendingSocialLink
      security: []
      responses:
        "200":
          description:
            Envelope data contains provider name or null for this session's live five-minute linking
            challenge.
      summary: Read the pending explicit provider-link challenge.
  /api/auth/social/link:
    post:
      operationId: confirmSocialLink
      summary: Link the session-bound provider identity after fresh trusted authentication.
      description:
        Requires CSRF, a live server-side challenge, fresh password or already-linked provider authentication
        after challenge creation, and matching canonical email. Refresh and email verification do not qualify. Provider
        identity cannot be reassigned.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Account envelope for the existing user. Challenge is cleared.
        "401":
          description: Fresh trusted authentication or a live linking challenge is required.
        "403":
          description: Invalid CSRF, inactive account, or account email mismatch.
        "409":
          description: Provider already linked to another account.
        "503":
          description: Retryable database failure; no partial link.
  /api/knowledge/tickets:
    get:
      operationId: browseKnowledgeTickets
      summary: Browse summaries in the explicitly selected workspace.
      description:
        Ordered by createdAt DESC then id DESC. Details type is applied before keyset pagination. Classification
        state never affects inclusion or ordering. No full Details or internal job fields are returned.
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: detailsType
          schema:
            type: string
            enum:
              - Knowledge
              - Coding
              - Problem
              - Decision
              - Accomplishment
              - Learning
          description: Omit for all Details writing types; independent of extracted attributes.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Requested size, capped at 50.
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 1024
          description: Opaque continuation from the same Details type selection.
      responses:
        "200":
          description: Bounded summaries and an optional continuation cursor.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  error:
                    type: "null"
                  data:
                    type: object
                    required:
                      - items
                      - nextCursor
                    properties:
                      items:
                        type: array
                        maxItems: 50
                        items:
                          $ref: "#/components/schemas/TicketSummary"
                      nextCursor:
                        type:
                          - string
                          - "null"
        "400":
          description: Invalid Details type, page size, malformed cursor, or cursor/type mismatch.
        "401":
          description: Authentication required.
        "403":
          description: Inactive account or workspace.
    post:
      operationId: createKnowledgeTicket
      summary: Publish a ticket immediately within the active member's workspace.
      description:
        Same submission ID and content safely return the original ticket. Changed content under the same
        ID returns 409. Classification runs after commit independently.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - submissionId
                - content
              properties:
                submissionId:
                  type: string
                  format: uuid
                content:
                  $ref: "#/components/schemas/TicketContent"
      responses:
        "201":
          description: Published ticket or an identical previous submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEnvelope"
        "400":
          description: INVALID_TICKET or malformed request.
        "401":
          description: Authentication required.
        "403":
          description: Inactive membership or invalid CSRF.
        "409":
          description: SUBMISSION_CONFLICT.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /api/knowledge/tickets/{id}:
    get:
      operationId: getKnowledgeTicket
      summary: Read a published ticket from the current workspace.
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published content and current automatic classification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEnvelope"
        "401":
          description: Authentication required.
        "403":
          description: Inactive membership.
        "404":
          description: TICKET_NOT_FOUND, including cross-workspace access.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /api/knowledge/tickets/refine:
    post:
      operationId: refineKnowledgeTicket
      summary: Concisely rephrase existing wording in the selected Title or Capture.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefinementRequest"
      responses:
        "200":
          description: Optional suggestions; no content has been persisted or changed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  error:
                    type: "null"
                  data:
                    type: object
                    required:
                      - field
                      - text
                    properties:
                      field:
                        type: string
                        enum:
                          - title
                          - capture
                      text:
                        type: string
                        minLength: 1
                        maxLength: 1000
                        description: Suggested wording for only the selected field; Title is limited to 200 characters.
        "400":
          description: INVALID_TICKET; complete required Details first.
        "401":
          description: Authentication required.
        "403":
          description: Inactive membership or invalid CSRF.
        "503":
          description: REFINEMENT_UNAVAILABLE; original content remains unchanged.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /actuator/health:
    get:
      operationId: aggregateHealth
      summary: Public aggregate health status without privileged details.
      responses:
        "200":
          description: UP.
        "503":
          description: A configured health contributor is down.
      security: []
  /actuator/health/{probe}:
    get:
      operationId: healthProbe
      summary: Public unwrapped liveness or database readiness probe.
      parameters:
        - in: path
          name: probe
          required: true
          schema:
            type: string
            enum:
              - liveness
              - readiness
      responses:
        "200":
          description: UP.
        "503":
          description: DOWN or out of service.
      security: []
  /actuator/metrics:
    get:
      operationId: listMetrics
      summary: Metric names are unavailable to product accounts.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Available Micrometer metric names.
        "401":
          description: Authentication required.
        "403":
          description: Product accounts, including workspace owners, are denied.
  /actuator/metrics/{name}:
    get:
      operationId: metricMeasurements
      summary: Metric measurements are unavailable to product accounts.
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metric measurements.
        "401":
          description: Authentication required.
        "403":
          description: Product accounts, including workspace owners, are denied.
        "404":
          description: Metric not found.
  /actuator/prometheus:
    get:
      operationId: prometheusScrape
      summary: Prometheus exposition is unavailable to product accounts.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Prometheus metrics, not wrapped in an API envelope.
        "401":
          description: Authentication required.
        "403":
          description: Product accounts, including workspace owners, are denied.
  /api/auth/invitation/preview:
    post:
      operationId: previewInvitationAcceptance
      summary: Inspect an invitation without registering or activating the recipient.
      description:
        Read-only invitation preview. Does not accept membership, sign out, or alter the current session.
        The UI offers an explicit account switch on recipient mismatch.
      parameters:
        - $ref: "#/components/parameters/InvitationCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationLink"
      responses:
        "200":
          description: Invitation status, message, and recipient/workspace for recognized credentials.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  error:
                    type: "null"
                  data:
                    type: object
                    required:
                      - status
                      - message
                      - workspaceName
                      - email
                    properties:
                      status:
                        type: string
                        enum:
                          - READY
                          - INVALID_INVITATION
                          - INVITATION_UNUSABLE
                          - INVITATION_USED
                          - ALREADY_MEMBER
                          - ACCOUNT_LIMIT
                      message:
                        type: string
                      workspaceName:
                        type:
                          - string
                          - "null"
                      email:
                        type:
                          - string
                          - "null"
        "400":
          description: Malformed invitation identifier or token.
        "403":
          description: CSRF_INVALID.
      security: []
  /api/auth/invitation/accept:
    post:
      operationId: acceptInvitation
      summary: Explicitly register an invited member and establish a browser session.
      description:
        Atomically consume a valid invitation and add workspace membership. New users supply fullName/password
        and receive a default workspace plus the invited membership. Existing active accounts must sign in as the
        recipient; pending accounts must supply their original password. Never replaces credentials/profile. Opens
        the invited workspace. Used links cannot issue sessions.
      parameters:
        - $ref: "#/components/parameters/InvitationCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invitation
              properties:
                invitation:
                  $ref: "#/components/schemas/InvitationLink"
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 200
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                  description: At least one Unicode uppercase letter and punctuation or symbol.
      responses:
        "200":
          description: Activated member and new session/refresh cookies. No-store response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "400":
          description: INVALID_REQUEST or INVALID_ROLE; invitation unchanged.
        "403":
          description: CSRF_INVALID.
        "409":
          description:
            INVALID_INVITATION, INVITATION_UNUSABLE, INVITATION_USED, ALREADY_MEMBER or ACCOUNT_LIMIT.
            No membership or account changes.
        "500":
          description: Registration or session failure; preview status before retrying, or log in if already accepted.
      security: []
  /api/invitations:
    get:
      operationId: getInvitationHistory
      summary: Load saved invitation records for the verified administrator's workspace.
      description: Returns 25 records per page, newest attempt first. Read-only; does not send email or expose tokens.
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            maximum: 85899345
            default: 0
      responses:
        "200":
          description: Workspace-scoped invitation records and whether older records exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationHistoryEnvelope"
        "400":
          description: Invalid page.
        "403":
          description: Verified-administrator authorization denied.
        "401":
          description: AUTHENTICATION_REQUIRED; session absent or expired.
    post:
      operationId: sendTeamInvitation
      summary: Send one team invitation as a verified workspace administrator.
      description:
        "Recipient membership is checked before pending invitation status. New sends

        check the workspace's configured active-account cap (default 10), including

        its administrator. Pending invitations reserve neither membership nor capacity.

        SENDING is persisted before SMTP; SMTP_ACCEPTED is success after relay acceptance

        and persistence, not guaranteed inbox delivery. FAILED remains retryable.

        Repeated requests during SENDING do not submit another email. Lost responses

        must be reconciled with /api/invitations/status before retrying.

        "
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationCsrf"
      requestBody:
        $ref: "#/components/requestBodies/InvitationEmail"
      responses:
        "200":
          description: SMTP_ACCEPTED, FAILED, or an already SENDING attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEnvelope"
        "400":
          description: Invalid email; INVALID_REQUEST.
        "403":
          description: CSRF_INVALID or verified-administrator authorization denied.
        "401":
          description: AUTHENTICATION_REQUIRED; session absent or expired.
        "409":
          description: ALREADY_MEMBER, INVITATION_PENDING, or ACCOUNT_LIMIT. No email sent.
        "500":
          description: Persistence failure; outcome may be uncertain. Check status before retry.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /api/invitations/sent:
    get:
      operationId: listSentInvitations
      summary: All pending, failed and accepted invitations in the verified administrator's workspace.
      description:
        "No truncation or pagination. Ordered by COALESCE(sentAt, attemptedAt) descending,

        then UUID descending. Expired pending and revoked records are excluded; accepted

        and failed records remain visible. sentAt is null until a confirmed SMTP submission.

        resendAvailableAt is the latest send/attempt plus 60 seconds. resending indicates

        a reserved replacement; deliveryFailed describes a failed delivery attempt without

        changing the current link status. No tokens are exposed.

        "
      security:
        - SessionCookie: []
      responses:
        "200":
          description:
            Envelope containing an array of invitation views (id, email, status, expiresAt, message,
            sentAt, resendAvailableAt, resending, deliveryFailed).
        "401":
          description: Authentication required.
        "403":
          description: Verified administrator required.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /api/invitations/members:
    get:
      operationId: listActiveMembers
      summary: All active members, including administrators, of the verified administrator's workspace.
      description:
        "No truncation or pagination. Ordered by activation timestamp (ACCOUNT.UPDATED_AT)

        descending, then UUID descending. Only active workspace memberships belonging to active accounts.

        Administrator accounts are included in both this list and capacity checks.

        "
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Envelope containing an array with fullName, email and role (OWNER or MEMBER).
        "401":
          description: Authentication required.
        "403":
          description: Verified administrator required.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /api/invitations/{id}/resend:
    post:
      operationId: resendInvitation
      summary: Replace an eligible invitation after a 60-second cooldown.
      description:
        "Workspace isolation, recipient eligibility and active-account capacity are checked

        under the same recipient/workspace locks as acceptance. Only FAILED or unexpired

        SMTP_ACCEPTED invitations are eligible. Reserve a replacement hash separately and

        send outside the transaction. Confirmed submission promotes the replacement with

        a fresh seven-day expiry, invalidating the old hash. Failure or SMTP timeout discards

        the replacement and preserves the old link/expiry; an ambiguously delivered replacement

        is unusable. Acceptance during delivery wins and completion never reopens it.

        Persistence failure after SMTP leaves a reserved replacement, blocking duplicate

        retries while keeping the old link usable; operational reconciliation is required.

        A lost HTTP response must be reconciled by reloading the sent list before retrying.

        "
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/InvitationCsrf"
      responses:
        "200":
          description:
            Current invitation view and result message. deliveryFailed=true means no replacement promotion;
            ACCEPTED means acceptance won the race.
        "401":
          description: Authentication required.
        "403":
          description: Verified administrator required or CSRF invalid.
        "404":
          description: Invitation absent or belongs to another workspace.
        "409":
          description:
            RESEND_COOLDOWN, RESEND_IN_PROGRESS, INVITATION_UNUSABLE, ALREADY_MEMBER or ACCOUNT_LIMIT.
            Existing invitation unchanged.
        "500":
          description: Uncertain persistence outcome; reload list before retry.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /api/invitations/status:
    post:
      operationId: getTeamInvitationSendStatus
      summary: Reconcile a send outcome within the authenticated administrator's workspace.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationCsrf"
      requestBody:
        $ref: "#/components/requestBodies/InvitationEmail"
      responses:
        "200":
          description: Current send state; does not send email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEnvelope"
        "400":
          description: Invalid email.
        "403":
          description: CSRF_INVALID or verified-administrator authorization denied.
        "401":
          description: AUTHENTICATION_REQUIRED; session absent or expired.
        "404":
          description: INVITATION_NOT_FOUND in this workspace; safe to retry sending.
    parameters:
      - name: X-Workspace-Id
        in: header
        required: true
        description:
          Explicit active workspace; the server requires active membership and owner role for invitation
          management.
        schema:
          type: string
          format: uuid
  /api/status:
    get:
      operationId: getStatus
      summary: Application and database availability
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEnvelope"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/registration:
    post:
      operationId: registerAccount
      summary: Create a pending global account and queue verification.
      description:
        Minimal name/email/password signup. Activation provisions exactly one default workspace and owner
        membership transactionally. Global normalized email uniqueness and existing credentials are preserved.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: Pending registration queued for verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingEnvelope"
        "400":
          description: Invalid name, email, or password.
        "403":
          description: Missing or invalid CSRF.
        "409":
          description: EMAIL_IN_USE. Log in or request verification.
        "503":
          description: Retryable service failure.
  /api/registration/resend:
    post:
      operationId: resendVerification
      summary:
        Queue a replacement using the same email row. Coalesce pending or retrying requests. The worker retries
        failures and rotates the token only after SMTP acceptance.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingEnvelope"
        "400":
          description: Invalid required input or link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF or access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "DUPLICATE_REGISTRATION: You cannot register this workspace. It is already registered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Database unavailable; queued email delivery happens asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description:
            Unexpected failure; outcome may be uncertain. Retry through documented registration/resend
            behavior.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "RESEND_COOLDOWN: wait 60 seconds since the last successful send; current link unchanged"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description:
            Masked token from /api/auth/csrf; include its session cookie. Refresh after login, verification
            sign-in, or logout.
  /api/registration/status:
    post:
      operationId: getRegistrationDeliveryStatus
      summary: Read current delivery state; email is in the body to avoid URL access logs.
      security: []
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description: Masked token from /api/auth/csrf with its session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "200":
          description: Current status; SMTP_ACCEPTED does not mean inbox delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingEnvelope"
        "400":
          description: Invalid input or registration not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid CSRF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/registration/verify:
    post:
      operationId: verifyRegistration
      summary:
        Atomically activate the pending account and provision its default workspace with OWNER membership.
        First verification establishes a session and rotates session ID and CSRF. Recheck active-domain uniqueness;
        losing registrant gets no access. Already-used links never create a new session.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationEnvelope"
        "400":
          description: Invalid required input or link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF or access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "DUPLICATE_REGISTRATION: You cannot register this workspace. It is already registered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Database unavailable; queued email delivery happens asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description:
            Unexpected failure; outcome may be uncertain. Retry through documented registration/resend
            behavior.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - token
              properties:
                id:
                  type: string
                  format: uuid
                token:
                  type: string
                  maxLength: 100
                  writeOnly: true
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description:
            Masked token from /api/auth/csrf; include its session cookie. Refresh after login, verification
            sign-in, or logout.
  /api/auth/csrf:
    get:
      operationId: getCsrf
      summary: Establish session and retrieve masked CSRF token. Call before mutations.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfEnvelope"
  /api/auth/login:
    post:
      operationId: login
      summary:
        Email/password login; both account and workspace must be ACTIVE. Rotate session ID and CSRF and issue
        a rotating refresh cookie.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "LOGIN_FAILED: invalid credentials or inactive account/workspace"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Invalid CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 128
                  writeOnly: true
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description:
            Masked token from /api/auth/csrf; include its session cookie. Refresh after login, verification
            sign-in, or logout.
  /api/auth/refresh:
    post:
      operationId: refreshSession
      summary: Restore a session and rotate the refresh cookie without extending its absolute expiry
      description:
        "Fetch /api/auth/csrf first, including the anonymous session cookie and masked token.

        Rechecks account and workspace status, current role, and password fingerprint.

        On success rotates JSESSIONID, invalidates the CSRF token, and replaces BETTERF_REFRESH.

        Fetch CSRF again before retrying a rejected mutation. Never retry uncertain network/server failures.

        "
      security:
        - RefreshCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationCsrf"
      responses:
        "200":
          description: Session restored; Cache-Control no-store and rotated HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401":
          description:
            SESSION_EXPIRED; refresh cookie absent, invalid, expired, replayed, revoked, or account no
            longer eligible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CSRF_INVALID; fetch a new masked CSRF token before submission.
  /api/auth/me:
    get:
      operationId: currentAccount
      summary: Read active authenticated account and workspace; recheck both statuses
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401":
          description: AUTHENTICATION_REQUIRED; session absent or expired.
        "403":
          description: Access denied or account/workspace no longer active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the browser refresh credential, invalidate session, and delete both cookies
      security:
        - SessionCookie: []
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Logged out, no body
        "403":
          description: Invalid CSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/workspaces:
    post:
      operationId: createWorkspace
      summary: Create an additional owned workspace
      requestBody: &id002
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses: &id001
        "200":
          description: Selected account and workspace membership list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "403":
          description: No active workspace access, owner permission, or valid CSRF.
  /api/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: selectWorkspace
      summary: Validate membership and return selected workspace context
      responses: *id001
    patch:
      operationId: renameWorkspace
      summary: Owner renames a workspace
      requestBody: *id002
      responses: *id001
components:
  parameters:
    InvitationCsrf:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
      description: Token from /api/auth/csrf with its session cookie.
  requestBodies:
    InvitationEmail:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                maxLength: 254
  securitySchemes:
    RefreshCookie:
      type: apiKey
      in: cookie
      name: BETTERF_REFRESH
      description: HttpOnly, Secure by default, SameSite Strict, Path /api/auth; absolute 14-day lifetime by default.
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    TicketSummary:
      type: object
      required:
        - id
        - title
        - capturePreview
        - detailsType
        - authorName
        - createdAt
        - classificationStatus
        - attributes
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        capturePreview:
          type:
            - string
            - "null"
          maxLength: 280
        detailsType:
          type: string
          enum:
            - Knowledge
            - Coding
            - Problem
            - Decision
            - Accomplishment
            - Learning
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        classificationStatus:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - RETRYING
            - COMPLETE
            - FAILED
        attributes:
          type: array
          items:
            type: string
          description: Extracted stable catalog IDs; clients display catalog labels in type, area, technology order.
    InvitationLink:
      type: object
      required:
        - id
        - token
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
    InvitationHistoryEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        error:
          type: "null"
        data:
          type: object
          required:
            - invitations
            - hasMore
          properties:
            invitations:
              type: array
              maxItems: 25
              items:
                $ref: "#/components/schemas/InvitationEnvelope/properties/data"
            hasMore:
              type: boolean
    InvitationEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        error:
          type: "null"
        data:
          type: object
          required:
            - id
            - email
            - status
            - expiresAt
            - message
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            status:
              type: string
              enum:
                - SENDING
                - SMTP_ACCEPTED
                - FAILED
                - REVOKED
                - ACCEPTED
            expiresAt:
              type: string
              format: date-time
            message:
              type: string
            sentAt:
              type:
                - string
                - "null"
              format: date-time
            resendAvailableAt:
              type:
                - string
                - "null"
              format: date-time
            resending:
              type: boolean
            deliveryFailed:
              type: boolean
    ErrorEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: "null"
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    Pending:
      type: object
      required:
        - email
        - resendAvailableAt
        - deliveryStatus
      properties:
        email:
          type: string
          format: email
        resendAvailableAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum:
            - PENDING
            - SENDING
            - SMTP_ACCEPTED
            - FAILED
            - CANCELLED
    Verification:
      type: object
      required:
        - status
        - account
      properties:
        status:
          type: string
          enum:
            - VERIFIED
            - ALREADY_VERIFIED
        account:
          description:
            Authenticated account after first verification or when this browser already holds its session.
            Null for an already-used link without a matching session; use password login.
          oneOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
    Csrf:
      type: object
      required:
        - token
        - headerName
      properties:
        token:
          type: string
        headerName:
          type: string
    Account:
      type: object
      required:
        - id
        - fullName
        - email
        - workspaceId
        - workspaceName
        - accessRole
        - workspaces
      properties:
        defaultWorkspaceId:
          type: [string, "null"]
          format: uuid
          description: The automatically assigned default workspace; independent of current selection.

        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        workspaceId:
          type:
            - string
            - "null"
          format: uuid
          description: Selected workspace in this response; null only when no active memberships remain.
        workspaceName:
          type:
            - string
            - "null"
        accessRole:
          type:
            - string
            - "null"
          enum:
            - OWNER
            - MEMBER
            - null
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    Registration:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: Requires uppercase and special characters.
    PendingEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/Pending"
        error:
          type: "null"
    VerificationEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/Verification"
        error:
          type: "null"
    CsrfEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/Csrf"
        error:
          type: "null"
    AccountEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/Account"
        error:
          type: "null"
    StatusEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - UP
        error:
          type: "null"
    DetailBlock:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - paragraph
            - heading
            - bulletList
            - orderedList
            - link
            - code
        text:
          type: string
          maxLength: 30000
        language:
          type:
            - string
            - "null"
          description:
            Required for code only; plaintext, java, typescript, javascript, python, sql, bash, json,
            yaml, html, css, csharp, cpp, go, rust, kotlin.
        url:
          type:
            - string
            - "null"
          maxLength: 30000
          description: Required for links only; absolute HTTP(S), without credentials.
    TicketContent:
      type: object
      required:
        - title
        - template
        - details
      description:
        Required content rejects Unicode whitespace/format-only values. Details count text plus URLs
        across all blocks in UTF-16 code units, excluding JSON markup, up to 30000. Coding requires a nonempty code
        block. Lists use one item per line.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        capture:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Optional; may be omitted or blank.
        template:
          type: string
          enum:
            - Knowledge
            - Coding
            - Problem
            - Decision
            - Accomplishment
            - Learning
        details:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/DetailBlock"
    TicketEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        error:
          type: "null"
        data:
          type: object
          required:
            - id
            - content
            - authorId
            - authorName
            - createdAt
            - classificationStatus
            - attributes
          properties:
            id:
              type: string
              format: uuid
            content:
              $ref: "#/components/schemas/TicketContent"
            authorId:
              type: string
              format: uuid
            authorName:
              type: string
            createdAt:
              type: string
              format: date-time
            classificationStatus:
              type: string
              enum:
                - PENDING
                - PROCESSING
                - RETRYING
                - COMPLETE
                - FAILED
            attributes:
              type: array
              uniqueItems: true
              description: Valid IDs from AttributeCatalog.ALL only. Empty on no-match or before successful classification.
              items:
                type: string
    RefinementRequest:
      type: object
      required:
        - field
        - content
      properties:
        field:
          type: string
          enum:
            - title
            - capture
        content:
          $ref: "#/components/schemas/TicketContent"
      description:
        Only existing selected-field wording is sent to the provider. Blank fields cannot be refined.
        Details are not refinement context or targets. All required ticket content must validate. Suggestions retain
        meaning and are bounded to the original trimmed length plus 20 percent (rounded up), with a minimum four-character
        allowance, and the field limit.
    Workspace:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
            - OWNER
            - MEMBER
servers:
  - url: /
    description: Same-origin application server
security:
  - SessionCookie: []
