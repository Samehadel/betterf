openapi: 3.1.0
info:
  title: BetterF API
  version: 0.1.1
  description:
    'BTF-5 implementation follows the product owner correction of 2026-10-04: separate account,
    organization, and email-delivery status records. Same-origin session cookie (HttpOnly, SameSite=Lax,
    Secure by default), 30-minute inactivity timeout. All mutations require CSRF.'
paths:
  /api/invitations:
    get:
      operationId: getInvitationHistory
      summary: Load saved invitation records for the verified administrator's company.
      description: Returns 25 records per page, newest attempt first. Read-only; does not send email or expose tokens.
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, maximum: 85899345, default: 0 }
      responses:
        '200':
          description: Company-scoped invitation records and whether older records exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationHistoryEnvelope'
        '400':
          description: Invalid page.
        '403':
          description: Authentication or verified-administrator authorization denied.
    post:
      operationId: sendTeamInvitation
      summary: Send one team invitation as a verified company administrator.
      description: |
        Recipient membership is checked before pending invitation status. New sends
        check the organization's configured active-account cap (default 10), including
        its administrator. Pending invitations reserve neither membership nor capacity.
        SENDING is persisted before SMTP; SMTP_ACCEPTED is success after relay acceptance
        and persistence, not guaranteed inbox delivery. FAILED remains retryable.
        Repeated requests during SENDING do not submit another email. Lost responses
        must be reconciled with /api/invitations/status before retrying.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InvitationCsrf'
      requestBody:
        $ref: '#/components/requestBodies/InvitationEmail'
      responses:
        '200':
          description: SMTP_ACCEPTED, FAILED, or an already SENDING attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '400':
          description: Invalid email; INVALID_REQUEST.
        '403':
          description: Authentication, CSRF, or verified-administrator authorization denied.
        '409':
          description: ALREADY_MEMBER, OTHER_COMPANY_MEMBER, INVITATION_PENDING, or ACCOUNT_LIMIT. No email sent.
        '500':
          description: Persistence failure; outcome may be uncertain. Check status before retry.
  /api/invitations/status:
    post:
      operationId: getTeamInvitationSendStatus
      summary: Reconcile a send outcome within the authenticated administrator's company.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InvitationCsrf'
      requestBody:
        $ref: '#/components/requestBodies/InvitationEmail'
      responses:
        '200':
          description: Current send state; does not send email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '400':
          description: Invalid email.
        '403':
          description: Authentication, CSRF, or verified-administrator authorization denied.
        '404':
          description: INVITATION_NOT_FOUND in this company; safe to retry sending.
  /api/status:
    get:
      operationId: getStatus
      summary: Application and database availability
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/registration/roles:
    get:
      operationId: getProfessionalRoles
      summary: Predefined professional roles for onboarding
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesEnvelope'
  /api/registration:
    post:
      operationId: registerOrganization
      summary:
        Persist PENDING organization and account and queue verification email. Repeated email submission
        reuses original data without overwriting credentials or sending again.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEnvelope'
        '400':
          description: Invalid required input or link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing/invalid CSRF or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'DUPLICATE_REGISTRATION: You cannot register this company. It is already registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Database unavailable; queued email delivery happens asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description:
            Unexpected failure; outcome may be uncertain. Retry through documented registration/resend
            behavior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description: Masked token from /api/auth/csrf; include its session cookie. Refresh after login, verification sign-in, or logout.
  /api/registration/resend:
    post:
      operationId: resendVerification
      summary: Queue a replacement using the same email row. Coalesce pending or retrying requests.
        The worker retries failures and rotates the token only after SMTP acceptance.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEnvelope'
        '400':
          description: Invalid required input or link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing/invalid CSRF or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'DUPLICATE_REGISTRATION: You cannot register this company. It is already registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Database unavailable; queued email delivery happens asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description:
            Unexpected failure; outcome may be uncertain. Retry through documented registration/resend
            behavior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description:
            'RESEND_COOLDOWN: wait 60 seconds since the last successful send; current link
            unchanged'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description: Masked token from /api/auth/csrf; include its session cookie. Refresh after login, verification sign-in, or logout.
  /api/registration/status:
    post:
      operationId: getRegistrationDeliveryStatus
      summary: Read current delivery state; email is in the body to avoid URL access logs.
      security: []
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description: Masked token from /api/auth/csrf with its session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '200':
          description: Current status; SMTP_ACCEPTED does not mean inbox delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEnvelope'
        '400':
          description: Invalid input or registration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing or invalid CSRF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/registration/verify:
    post:
      operationId: verifyRegistration
      summary:
        Atomically activate pending account and organization and grant ADMIN. First verification
        establishes a session and rotates session ID and CSRF. Recheck active-domain uniqueness;
        losing registrant gets no access. Already-used links never create a new session.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationEnvelope'
        '400':
          description: Invalid required input or link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing/invalid CSRF or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'DUPLICATE_REGISTRATION: You cannot register this company. It is already registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Database unavailable; queued email delivery happens asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description:
            Unexpected failure; outcome may be uncertain. Retry through documented registration/resend
            behavior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - token
              properties:
                id:
                  type: string
                  format: uuid
                token:
                  type: string
                  maxLength: 100
                  writeOnly: true
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description: Masked token from /api/auth/csrf; include its session cookie. Refresh after login, verification sign-in, or logout.
  /api/auth/csrf:
    get:
      operationId: getCsrf
      summary: Establish session and retrieve masked CSRF token. Call before mutations.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
  /api/auth/login:
    post:
      operationId: login
      summary:
        Email/password login; both account and organization must be ACTIVE. Rotate session ID and
        CSRF.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'LOGIN_FAILED: invalid credentials or inactive account/organization'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Invalid CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 128
                  writeOnly: true
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description: Masked token from /api/auth/csrf; include its session cookie. Refresh after login, verification sign-in, or logout.
  /api/auth/me:
    get:
      operationId: currentAccount
      summary: Read active authenticated account and organization; recheck both statuses
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '403':
          description: Access denied or account/organization no longer active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Invalidate session and delete session cookie
      security:
        - SessionCookie: []
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Logged out, no body
        '403':
          description: Invalid CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    InvitationCsrf:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema: { type: string }
      description: Token from /api/auth/csrf with its session cookie.
  requestBodies:
    InvitationEmail:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email, maxLength: 254 }
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    InvitationHistoryEnvelope:
      type: object
      required: [data, error]
      properties:
        error: { type: 'null' }
        data:
          type: object
          required: [invitations, hasMore]
          properties:
            invitations:
              type: array
              maxItems: 25
              items:
                $ref: '#/components/schemas/InvitationEnvelope/properties/data'
            hasMore: { type: boolean }
    InvitationEnvelope:
      type: object
      required: [data, error]
      properties:
        error: { type: 'null' }
        data:
          type: object
          required: [id, email, status, expiresAt, message]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            status: { type: string, enum: [SENDING, SMTP_ACCEPTED, FAILED, REVOKED, ACCEPTED] }
            expiresAt: { type: string, format: date-time }
            message: { type: string }
    ErrorEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: 'null'
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    Role:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
        label:
          type: string
    Pending:
      type: object
      required:
        - email
        - resendAvailableAt
        - deliveryStatus
      properties:
        email:
          type: string
          format: email
        resendAvailableAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum:
            - PENDING
            - SENDING
            - SMTP_ACCEPTED
            - FAILED
            - CANCELLED
    Verification:
      type: object
      required:
        - status
        - account
      properties:
        status:
          type: string
          enum:
            - VERIFIED
            - ALREADY_VERIFIED
        account:
          description: Authenticated account after first verification or when this browser already holds its session. Null for an already-used link without a matching session; use password login.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - type: 'null'
    Csrf:
      type: object
      required:
        - token
        - headerName
      properties:
        token:
          type: string
        headerName:
          type: string
    Account:
      type: object
      required:
        - id
        - fullName
        - email
        - professionalRole
        - organizationId
        - organizationName
        - accessRole
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        professionalRole:
          type: string
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        accessRole:
          type: string
          enum:
            - ADMIN
            - MEMBER
    Registration:
      type: object
      required:
        - companyName
        - website
        - specialization
        - fullName
        - email
        - password
        - professionalRole
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 200
        website:
          type: string
          maxLength: 253
          description:
            HTTPS registry root domain; root slash optional. No subdomain, non-root path, query,
            fragment, credentials, or explicit port. Valid multi-label registry suffixes supported.
        specialization:
          type: string
          minLength: 1
          maxLength: 200
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          pattern: '^(?=[\s\S]*\p{Lu})(?=[\s\S]*[\p{P}\p{S}])[\s\S]*$'
          description: At least one uppercase letter and one punctuation or symbol character. Whitespace alone does not count as a special character.
          writeOnly: true
        professionalRole:
          type: string
          description: ID returned by GET /api/registration/roles. Unrelated to access role.
    PendingEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/Pending'
        error:
          type: 'null'
    VerificationEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/Verification'
        error:
          type: 'null'
    CsrfEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/Csrf'
        error:
          type: 'null'
    AccountEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/Account'
        error:
          type: 'null'
    RolesEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        error:
          type: 'null'
    StatusEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - UP
        error:
          type: 'null'
