name: betterf
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: betterf
      POSTGRES_USER: ${DB_USER:-betterf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d betterf"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
